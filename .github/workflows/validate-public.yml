name: Validate public commons

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f README.md
          test -f LICENSE
          test -f NOTICE
          test -f CONTRIBUTING.md
          test -f STATUS.md
          test -f docs/PUBLIC_BOUNDARY.md
          test -f docs/LEARNER_AUTONOMY.md
          test -f docs/SOURCE_PROVENANCE_MODEL.md
          test -f docs/CONCEPT_GRAPH_MODEL.md
          test -f docs/MUZE_X_LAB_BRIDGE.md
          test -f docs/VISUAL_FIELD_MODEL.md
          test -f docs/CONTENT_AGGREGATION_MODEL.md
          test -f schemas/resource.schema.json
          test -f schemas/concept.schema.json
          test -f schemas/relation.schema.json
          test -f schemas/learning-source.schema.json
          test -f data/starter-mesh.json
          test -f data/learning-catalog.json
          test -f public/index.html
          test -f public/swarm/index.html
          test -f public/assets/styles.css
          test -f public/assets/learning.css
          test -f public/assets/anchor.css
          test -f public/assets/swarm-lab.css
          test -f public/assets/swarm.js
          test -f public/assets/app.js
          test -f public/assets/brand-logo.svg
          test -f public/assets/favicon.svg

      - name: Validate JSON syntax and public URLs
        run: |
          python -m json.tool schemas/resource.schema.json >/dev/null
          python -m json.tool schemas/concept.schema.json >/dev/null
          python -m json.tool schemas/relation.schema.json >/dev/null
          python -m json.tool schemas/learning-source.schema.json >/dev/null
          python -m json.tool data/starter-mesh.json >/dev/null
          python -m json.tool data/learning-catalog.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          files = ['data/starter-mesh.json', 'data/learning-catalog.json']
          bad = []
          for filename in files:
              data = json.loads(Path(filename).read_text())
              for resource in data.get('resources', []):
                  url = str(resource.get('canonical_url', ''))
                  if not url.startswith('https://'):
                      bad.append((filename, resource.get('id'), url))
          if bad:
              raise SystemExit(f'Non-HTTPS public resource URL(s): {bad}')
          PY

      - name: Check JavaScript syntax
        run: |
          node --check public/assets/swarm.js
          node --check public/assets/app.js

      - name: Preserve learning aggregator
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="learning-field"' public/index.html
          grep -q 'id="learning-grid"' public/index.html
          grep -q 'learning-catalog.json' public/assets/app.js
          grep -q 'INDEXED_RESOURCE' docs/CONTENT_AGGREGATION_MODEL.md
          grep -q 'REUSE' docs/CONTENT_AGGREGATION_MODEL.md

      - name: Keep swarm controls out of learning interface
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'data-field-mode=' public/index.html; then
            echo 'Swarm mode controls belong to the dedicated Swarm Field Lab, not the learning interface.' >&2
            exit 1
          fi
          grep -q 'data-field-mode="attract"' public/swarm/index.html
          grep -q 'data-field-speed="4.4"' public/swarm/index.html
          grep -q 'clamp(parsed, .65, 4.4)' public/assets/swarm.js
          grep -q 'swarm.js?v=4.4.1' public/swarm/index.html
          grep -q 'Swarm Field Lab' public/swarm/index.html

      - name: Preserve header controls footer note and ring anchor
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'class="lab-header-controls"' public/swarm/index.html
          grep -q 'class="lab-footer"' public/swarm/index.html
          grep -q 'data-swarm-anchor-mode="ring"' public/swarm/index.html
          grep -q 'data-swarm-anchor-strength="0.30"' public/swarm/index.html
          grep -q 'ANCRE ANNULAIRE' public/swarm/index.html
          grep -q 'applyRingAnchor' public/assets/swarm.js
          grep -q 'The target is the circumference, not the centre' public/assets/swarm.js
          if grep -q 'lab-drawer' public/swarm/index.html; then
            echo 'Swarm Field Lab controls must stay in the header, not in a side drawer.' >&2
            exit 1
          fi

      - name: Preserve immersive Muze-X portal bridge and bottom anchor
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'data-swarm-anchor' public/index.html
          grep -q 'class="orb-link swarm-anchor"' public/index.html
          grep -q 'interface-technique' public/index.html
          grep -q 'anchor.css' public/index.html
          grep -q 'https://muse-irs.github.io/muze-x-lab-collaborative-platform/' public/index.html
          grep -q 'updateAnchor' public/assets/swarm.js
          grep -q 'PORTAL_ATTRACTOR' docs/MUZE_X_LAB_BRIDGE.md

      - name: Preserve conceptual interface qualification
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Logique d’interface conceptuelle Muze-X' public/index.html
          grep -q 'métaphore visuelle ≠ modèle scientifique' public/index.html
          grep -q 'Technique actuelle' public/index.html
          grep -q 'profondeur perceptive émergente' public/index.html

      - name: Enforce public boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'PRIVATE_CASE|PERSONAL_CASE|secret_key|api_key|client_secret|sk-[A-Za-z0-9_-]+' . --exclude-dir=.git --exclude='validate-public.yml'; then
            echo 'Private or credential-like marker found in public repository.' >&2
            exit 1
          fi
          if find . -type f \( -name '.env' -o -name '.env.local' -o -name '*.p12' -o -name '*.pfx' -o -name '*.pem' -o -name '*.key' \) | grep -q .; then
            echo 'Environment or private-key files must not be committed.' >&2
            exit 1
          fi
